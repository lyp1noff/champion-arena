root = "."
tmp_dir = "/tmp/champion-outbox"

[build]
cmd = "go build -o /tmp/champion-outbox/outbox ./cmd/outbox-worker"
bin = "/tmp/champion-outbox/outbox"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
clean_on_exit = true
