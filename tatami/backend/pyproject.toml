[project]
name = "champion-tatami"
version = "0.1.0"
description = ""
authors = [
    {name = "lyp1noff",email = "lyp1noff@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "champion-domain",
    "fastapi>=0.118.0,<0.119.0",
    "uvicorn>=0.37.0,<0.38.0",
    "asyncpg>=0.30.0,<0.31.0",
    "sqlalchemy[asyncio]>=2.0.42,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "gunicorn>=23.0.0,<24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "black>=26.3.1,<27.0.0",
    "isort>=6.0.1,<7.0.0",
    "mypy>=1.17.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "flake8>=7.3.0,<8.0.0",
    "pre-commit>=4.2.0,<5.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
champion-domain = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
show_error_codes = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["tests", "scripts", "alembic"]
